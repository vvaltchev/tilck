# The package manager's own pipeline: everything that judges its
# logic, on a stock distro image, independent of any toolchain build.
#
#   tests     the unit suite (lint, model, laws, ~1,000 tests), then
#             the exhaustive lane: every small world x every command
#             line against the model. Minutes.
#
#   mutation  the certificate that the tests are enough: every site
#             of the logic core is made wrong one way and the whole
#             suite must fail. Tens of minutes, so its own job.
#
# The six toolchain workflows run `-t --exhaustive` too, before they
# build anything; this one exists so that the package manager is
# judged even when nothing else is, and so that mutation, which no
# toolchain build should wait on, still runs on every change.
#
name: Package manager

# Not skipped on exp-* branches, unlike the kernel workflows: those
# need their containers updating, while this one runs on a stock
# image, and the package manager's work happens on exactly those
# branches. (A workflow can only be dispatched by name once it exists
# on the default branch; on a topic branch the push is the trigger.)
on:
  push:
    branches-ignore: [readme*, temp-*]
    paths:
      - '.github/workflows/ci-pkgmgr.yml'
      - 'scripts/build_toolchain'
      - 'scripts/bash_build_toolchain'
      - 'scripts/bash_includes/**'
      - 'scripts/pkgmgr/**'
      - 'scripts/dev/claude/pmmutate'
      - 'other/pkg_versions'
      - 'other/host_pkg_versions'
      - '!**/*.md'
  pull_request:
    paths:
      - 'scripts/pkgmgr/**'
      - 'scripts/dev/claude/pmmutate'
  workflow_dispatch:

# One run per branch at a time: a push while a run is in progress
# cancels it, since the newer commit is what the branch is now and the
# older result would be about something it no longer holds. Several
# pushes in a row used to queue a run each.
concurrency:
  group: pkgmgr-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNING_IN_CI: 1
  # let git trust the root-owned container checkout (the tests run
  # git: the mutation job makes a worktree per worker)
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
  TILCK_NO_LOGO: 1
  ARCH: i386

jobs:
  lane-cost:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: overlay-tmp
            opts: ""
          - name: tmpfs-tmp
            opts: "--tmpfs /tmp:exec,size=8g"
    container:
      image: debian:stable-slim
      options: ${{ matrix.opts }}
    name: lane cost (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - name: One shape of the exhaustive lane, timed
        run: |
          ./scripts/build_toolchain -t -q > /dev/null 2>&1 || true
          df -hT /tmp | tail -1; nproc
          RUBY="$(ls toolchain5/linux-*/*/any/pkgs/ruby/*/bin/ruby 2>/dev/null | head -1)"; RUBY="${RUBY:-$(command -v ruby)}"; $RUBY --version
          cd scripts/pkgmgr
          for shape in target target_rv chain; do
            $RUBY -e 'require_relative "tests/exhaustive/runner"; Exhaustive.run_all(shapes: [ARGV[0]], jobs: 1)' $shape 2>&1 | grep -E "cases"
          done
